{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Vikas Washing System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f4f6f9;
        }

        /* ===== HEADER ===== */
        .topbar {
            background: #1f2937;
            color: white;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topbar h2 {
            margin: 0;
            font-size: 20px;
        }

        .topbar span {
            font-size: 13px;
            color: #cbd5e1;
        }

        /* ===== LAYOUT ===== */
        .wrapper {
            display: flex;
            min-height: calc(100vh - 60px);
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 200px;
            background: #111827;
            padding: 20px 0;
        }

        .sidebar a {
            display: block;
            padding: 12px 25px;
            color: #d1d5db;
            text-decoration: none;
            font-size: 14px;
            border-left: 4px solid transparent;
        }

        .sidebar a:hover {
            background: #1f2937;
            color: white;
            border-left: 4px solid #3b82f6;
        }

        .sidebar h4 {
            color: #9ca3af;
            font-size: 12px;
            padding: 10px 25px;
            margin-top: 20px;
            text-transform: uppercase;
        }

        /* ===== CONTENT ===== */
        .content {
            flex: 1;
            padding: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        h2 {
            margin-top: 0;
            {% comment %} color: #1f2937; {% endcomment %}
        }

        /* ===== FORM ===== */
        form label {
            font-weight: 600;
            font-size: 14px;
        }

        form input, form select {
            width: 100%;
            padding: 8px;
            margin: 6px 0 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #1d4ed8;
        }

        /* ===== TABLE ===== */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
        }

        th, td {
            padding: 10px;
            border: 1px solid #e5e7eb;
            text-align: center;
        }

        th {
            background: #1f2937;
            color: white;
            font-size: 14px;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
        }

        .btn-danger {
            background: #dc2626;
        }

        .btn-danger:hover {
            background: #b91c1c;
        }

        .btn-edit {
            background: #059669;
        }

        .btn-edit:hover {
            background: #047857;
        }
    </style>
</head>

<body>

<!-- HEADER -->
<div class="topbar">
    <h2>Vikas Washing Company</h2>
    <span>Laundry Billing & Management System</span>
</div>

<div class="wrapper">

    <!-- SIDEBAR -->
    <div class="sidebar">
        <a href="{% url 'home' %}">🏠 Home</a>
        <a href="{% url 'about' %}">ℹ️ About</a>

        <h4>Billing</h4>
        <a href="{% url 'create_bill' %}">➕ Create Bill</a>
        <a href="{% url 'billing_list' %}">📄 Billing List</a>
        <a href="{% url 'billing_summary' %}">📊 Summary</a>

        <h4>Master Data</h4>
        <a href="{% url 'add_hotel' %}">🏨 Hotels</a>
        <a href="{% url 'add_item' %}">🧺 Items</a>
        <a href="{% url 'add_hotel_item_rate' %}">💰 Rates</a>
    </div>

    <!-- CONTENT -->
    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

</div>

</body>
</html>
